<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1320">
<title>Join · The Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Phone page: one column, big touch targets, readable at arm's length. */
:root{
  --paper:#F5F7FB; --surface:#FFFFFF; --ink:#131A2C; --muted:#56607A; --line:#D5DBE7; --grid:rgba(31,79,224,.075);
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --hi:#FFD23F; --good:#0E7F57; --bad:#C62828;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0E1320;--surface:#161D2E;--ink:#E9EDF6;--muted:#9BA5BB;--line:#2A3449;--grid:rgba(122,149,255,.08);--accent:#7C96FF;--accent-ink:#0E1320;--good:#3CC48C;--bad:#FF6B6B;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.02em}
.brand .mark{display:inline-grid;place-items:center;width:30px;height:30px;border:2.5px solid var(--ink);border-radius:8px;font-size:18px;background:var(--hi);color:#131A2C}
h1{font-family:var(--display);font-weight:900;font-size:48px;line-height:.95;margin:6px 0 0}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
label{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;font-size:28px;font-weight:700;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);width:100%}
input.code{font-family:var(--display);font-size:44px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.go{font-family:var(--display);font-weight:900;font-size:34px;padding:14px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.go[disabled]{opacity:.5}
.link{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;padding:6px 0;align-self:flex-start}
.msg{margin:0;font-weight:700}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.muted{color:var(--muted)}
.big{font-family:var(--display);font-weight:900;font-size:64px;line-height:1}
.you{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--good);margin-right:6px}
.dot.off{background:var(--bad)}
.wait{display:flex;gap:6px;justify-content:center;padding:8px 0}
.wait i{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:b 1.2s infinite ease-in-out}
.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.wait i{animation:none}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" defer></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/live.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const store = {get(k) { try { return localStorage.getItem("mgr-join:" + k) || ""; } catch (e) { return ""; } },
                 set(k, v) { try { localStorage.setItem("mgr-join:" + k, v); } catch (e) {} }};
  const params = new URLSearchParams(location.search);
  const S = {view: "form", code: (params.get("code") || store.get("code") || "").toUpperCase().slice(0, 4), name: store.get("name"), err: "", busy: false, state: null, me: null};
  const brand = `<div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M7 1v18M13 1v18M1 7h18M1 13h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></span>The Grid</div>`;
  const ERR = {
    "not-configured": "Live play isn't set up yet. Ask your teacher.",
    "sdk-blocked": "Couldn't reach the game server. The Wi-Fi may be blocking it. Try mobile data.",
    "timeout": "The game server didn't answer. Check your connection and try again.",
    "no-room": "No game with that code. Check the code on the board.",
    "bad-code": "The code is 4 letters. Check the board.",
    "no-name": "Type your name first.",
  };
  const errText = e => ERR[e && e.message] || "Something went wrong. Try again.";

  function render() {
    const app = $("#app");
    if (S.view === "form") {
      app.innerHTML = `${brand}<h1>Get on the Grid</h1>
        <form class="card" id="f" autocomplete="off">
          <label for="code">Game code</label><input id="code" class="code" inputmode="text" autocapitalize="characters" maxlength="4" value="${esc(S.code)}" placeholder="ABCD" required>
          <label for="name">Your name</label><input id="name" maxlength="16" value="${esc(S.name)}" placeholder="First name" required>
          ${S.err ? `<p class="msg bad">${esc(S.err)}</p>` : ""}
          <button class="go" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "Joining…" : "Join"}</button>
        </form>`;
      $("#f").onsubmit = e => { e.preventDefault(); join($("#code").value, $("#name").value); };
      if (!S.code) $("#code").focus(); else if (!S.name) $("#name").focus();
    } else if (S.view === "in") {
      const st = S.state || {}, online = S.me && S.me.online !== false;
      app.innerHTML = `${brand}
        <div class="card"><div class="you"><span class="big">${esc(S.me ? S.me.name : S.name)}</span><span class="muted"><span class="dot ${online ? "" : "off"}"></span>${online ? "Connected" : "Reconnecting"}</span></div>
          <p class="msg good">You're in game ${esc(S.code)}.</p></div>
        <div class="card"><p class="msg">${st.phase === "lobby" || !st.game ? "Watch the board. The game will start soon." : "The game is running. Watch the board."}</p><div class="wait" aria-hidden="true"><i></i><i></i><i></i></div></div>
        <button class="link" id="leave" type="button">Leave this game</button>`;
      $("#leave").onclick = async () => { await Live.player.leave(); S.view = "form"; S.err = ""; render(); };
    } else if (S.view === "gone") {
      app.innerHTML = `${brand}<div class="card"><p class="msg">${esc(S.err)}</p><button class="go" id="again" type="button">Join a game</button></div>`;
      $("#again").onclick = () => { S.view = "form"; S.err = ""; render(); };
    }
  }

  async function join(code, name, auto) {
    if (!window.Live) { S.err = "The page didn't load properly. Refresh and try again."; return render(); }
    S.code = Live.cleanCode(code); S.name = Live.cleanName(name); S.busy = true; S.err = ""; render();
    try {
      await Live.player.join(S.code, S.name);
      store.set("code", S.code); store.set("name", S.name);
      S.busy = false; S.view = "in"; render();
      let seenMe = false;
      Live.player.onMe(me => {
        if (me) { seenMe = true; S.me = me; if (S.view === "in") render(); }
        else if (seenMe) { Live.player.leave(); S.view = "gone"; S.err = "Your teacher removed you from this game."; render(); }
      });
      Live.player.onState(st => {
        if (st === null) { Live.player.leave(); S.view = "gone"; S.err = "The game has ended. Thanks for playing!"; render(); return; }
        S.state = st; if (S.view === "in") render();
      });
    } catch (e) { S.busy = false; S.err = auto && e.message === "no-room" ? "" : errText(e); S.view = "form"; render(); }
  }

  render();
  // Coming back to this page (refresh, or the phone went to sleep): rejoin the same game automatically.
  if (params.get("code") === null && S.code && S.name && store.get("code") === S.code) join(S.code, S.name, true);
});
</script>
</body>
</html>
