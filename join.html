<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1320">
<title>Join · The Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Phone page: one column, big touch targets, readable at arm's length. */
:root{
  --paper:#F5F7FB; --surface:#FFFFFF; --ink:#131A2C; --muted:#56607A; --line:#D5DBE7; --grid:rgba(31,79,224,.075);
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --hi:#FFD23F; --good:#0E7F57; --bad:#C62828;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0E1320;--surface:#161D2E;--ink:#E9EDF6;--muted:#9BA5BB;--line:#2A3449;--grid:rgba(122,149,255,.08);--accent:#7C96FF;--accent-ink:#0E1320;--good:#3CC48C;--bad:#FF6B6B;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.02em}
.brand .mark{display:inline-grid;place-items:center;width:30px;height:30px;border:2.5px solid var(--ink);border-radius:8px;font-size:18px;background:var(--hi);color:#131A2C}
h1{font-family:var(--display);font-weight:900;font-size:48px;line-height:.95;margin:6px 0 0}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
label{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;font-size:28px;font-weight:700;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);width:100%}
input.code{font-family:var(--display);font-size:44px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.go{font-family:var(--display);font-weight:900;font-size:34px;padding:14px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.go[disabled]{opacity:.5}
.link{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;padding:6px 0;align-self:flex-start}
.msg{margin:0;font-weight:700}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.muted{color:var(--muted)}
.big{font-family:var(--display);font-weight:900;font-size:64px;line-height:1}
.you{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--good);margin-right:6px}
.dot.off{background:var(--bad)}
.wait{display:flex;gap:6px;justify-content:center;padding:8px 0}
.wait i{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:b 1.2s infinite ease-in-out}
.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.wait i{animation:none}}
/* ---------- bingo on the phone ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pts{font-family:var(--display);font-weight:900;font-size:22px;padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
h2{font-family:var(--display);font-weight:900;font-size:36px;line-height:1;margin:0}
.prize{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:12px;border:2px solid var(--accent);font-weight:700}
.card.call{flex-direction:row;padding:12px 18px;align-items:center;justify-content:space-between;gap:12px}
.call{padding:12px 18px}.call .num{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9}
.results{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--hi);color:#131A2C}.results p{margin:0}
.pcard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{aspect-ratio:1;border:3px solid var(--ink);border-radius:16px;background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:900;font-size:clamp(34px,11vw,52px);display:grid;place-items:center;position:relative;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cell.empty{border-style:dashed;color:var(--muted)}
.cell.sel{outline:4px solid var(--accent);outline-offset:2px}
.cell.hit{background:var(--good);border-color:var(--good);color:#fff}
.cell.hit::after{content:"";position:absolute;inset:18%;border-radius:50%;border:4px solid rgba(255,255,255,.75)}
.cell.pending{background:color-mix(in srgb,var(--good) 45%,var(--surface))}
.cell.miss{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keys button{font-family:var(--display);font-weight:900;font-size:24px;padding:10px 0;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.keys button:active{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;align-items:center}
.row .go{flex:1}
.flash{margin:0;min-height:1.5em;font-weight:700;text-align:center}
.flash.bad{color:var(--bad)} .flash.good{color:var(--good)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(14,19,32,.82);z-index:10;padding:20px;text-align:center}
.win div{background:var(--hi);color:#131A2C;border:4px solid #131A2C;border-radius:24px;padding:28px 22px;font-family:var(--display);font-weight:900;font-size:56px;line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.win small{display:block;font-family:var(--body);font-size:20px;margin-top:10px}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" defer></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/live.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const store = {get(k) { try { return localStorage.getItem("mgr-join:" + k) || ""; } catch (e) { return ""; } },
                 set(k, v) { try { localStorage.setItem("mgr-join:" + k, v); } catch (e) {} }};
  const params = new URLSearchParams(location.search);
  const S = {view: "form", code: (params.get("code") || store.get("code") || "").toUpperCase().slice(0, 4), name: store.get("name"), err: "", busy: false, state: null, me: null,
             card: null, marks: {}, draft: Array(9).fill(null), sel: 0, editing: false, pending: {}, flash: null, celebrated: {}, gameId: null, typed: "", shake: -1};
  const PRIZES = {line: ["a line", 1], corners: ["four corners", 2], full: ["a full house", 3]};
  const brand = `<div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M7 1v18M13 1v18M1 7h18M1 13h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></span>The Grid</div>`;
  const ERR = {
    "not-configured": "Live play isn't set up yet. Ask your teacher.",
    "sdk-blocked": "Couldn't reach the game server. The Wi-Fi may be blocking it. Try mobile data.",
    "timeout": "The game server didn't answer. Check your connection and try again.",
    "no-room": "No game with that code. Check the code on the board.",
    "bad-code": "The code is 4 letters. Check the board.",
    "no-name": "Type your name first.",
  };
  const errText = e => ERR[e && e.message] || "Something went wrong. Try again.";

  function render() {
    const app = $("#app");
    if (S.view === "form") {
      app.innerHTML = `${brand}<h1>Get on the Grid</h1>
        <form class="card" id="f" autocomplete="off">
          <label for="code">Game code</label><input id="code" class="code" inputmode="text" autocapitalize="characters" maxlength="4" value="${esc(S.code)}" placeholder="ABCD" required>
          <label for="name">Your name</label><input id="name" maxlength="16" value="${esc(S.name)}" placeholder="First name" required>
          ${S.err ? `<p class="msg bad">${esc(S.err)}</p>` : ""}
          <button class="go" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "Joining…" : "Join"}</button>
        </form>`;
      $("#f").onsubmit = e => { e.preventDefault(); join($("#code").value, $("#name").value); };
      if (!S.code) $("#code").focus(); else if (!S.name) $("#name").focus();
    } else if (S.view === "in" && S.state && S.state.game === "bingo") {
      renderBingo(app);
    } else if (S.view === "in") {
      const st = S.state || {}, online = S.me && S.me.online !== false;
      app.innerHTML = `${brand}
        <div class="card"><div class="you"><span class="big">${esc(S.me ? S.me.name : S.name)}</span><span class="muted"><span class="dot ${online ? "" : "off"}"></span>${online ? "Connected" : "Reconnecting"}</span></div>
          <p class="msg good">You're in game ${esc(S.code)}.</p></div>
        <div class="card"><p class="msg">${st.phase === "lobby" || !st.game ? "Watch the board. The game will start soon." : "The game is running. Watch the board."}</p><div class="wait" aria-hidden="true"><i></i><i></i><i></i></div></div>
        <button class="link" id="leave" type="button">Leave this game</button>`;
      $("#leave").onclick = async () => { await Live.player.leave(); S.view = "form"; S.err = ""; render(); };
    } else if (S.view === "gone") {
      app.innerHTML = `${brand}<div class="card"><p class="msg">${esc(S.err)}</p><button class="go" id="again" type="button">Join a game</button></div>`;
      $("#again").onclick = () => { S.view = "form"; S.err = ""; render(); };
    }
  }

  /* ---------- bingo ---------- */
  const markOf = i => S.marks[i] || S.pending[i] || null;
  function missedCells() {                    // numbers called before this one that you didn't mark in time
    const st = S.state, out = Array(9).fill(false); if (!S.card || !st.calls) return out;
    const cnt = {}; st.calls.slice(0, -1).forEach(v => cnt[v] = (cnt[v] || 0) + 1);
    S.card.forEach((v, i) => {
      if (markOf(i) || !cnt[v]) return;
      const marked = S.card.filter((w, j) => w === v && markOf(j)).length, before = S.card.slice(0, i).filter((w, j) => w === v && !markOf(j)).length;
      if (cnt[v] - marked > before) out[i] = true;
    });
    return out;
  }
  function celebrate() {
    const st = S.state; if (!st || !st.winners) return;
    for (const k of Object.keys(PRIZES)) {
      const w = st.winners[k]; if (!w || S.celebrated[k]) continue;
      S.celebrated[k] = true;
      if ((Array.isArray(w) ? w : Object.values(w)).some(x => x && x.id === Live.uid)) {
        const el = document.createElement("div"); el.className = "win";
        el.innerHTML = `<div>${k === "full" ? "BINGO!" : k === "corners" ? "Four corners!" : "A line!"}<small>+${PRIZES[k][1]} ${PRIZES[k][1] === 1 ? "point" : "points"}</small></div>`;
        document.body.appendChild(el); setTimeout(() => el.remove(), 3500); el.onclick = () => el.remove();
        try { navigator.vibrate && navigator.vibrate([120, 60, 120, 60, 240]); } catch (e) {}
      }
    }
  }
  function flash(text, tone, cell) { S.flash = {text, tone}; S.shake = cell == null ? -1 : cell; render(); S.shake = -1; }
  function tapMark(i) {
    const st = S.state;
    if (st.phase !== "playing" || !S.card || markOf(i)) return;
    if (S.card[i] !== st.last) return flash(`${S.card[i]} hasn't just been called. The last number was ${st.last}.`, "bad", i);
    if (Object.values(S.marks).includes(st.callKey) || Object.values(S.pending).includes(st.callKey)) return flash("You've already marked this number once.", "bad", i);
    S.pending[i] = st.callKey; S.flash = null; render();
    Live.player.mark(i, st.callKey).catch(() => { delete S.pending[i]; flash("Too late: the next number had already been rolled.", "bad", i); });
  }
  function renderBingo(app) {
    const st = S.state, cfg = st.cfg || {lo: 1, hi: 6, title: ""}, me = S.me || {}, pts = me.score || 0;
    const top = `<div class="top">${brand}<span class="pts">${pts} ${pts === 1 ? "pt" : "pts"}</span></div>`;
    const prizeLine = st.phase === "over" ? `<div class="prize"><span>Game over</span><span>Wait for the next game</span></div>`
      : PRIZES[st.prize] ? `<div class="prize"><span>Playing for ${PRIZES[st.prize][0]}</span><span>${PRIZES[st.prize][1]} ${PRIZES[st.prize][1] === 1 ? "pt" : "pts"}</span></div>` : "";
    const winners = Object.keys(PRIZES).filter(k => st.winners && st.winners[k]).map(k => { const w = st.winners[k]; return `<p class="muted" style="margin:0">${PRIZES[k][0][0].toUpperCase() + PRIZES[k][0].slice(1)}: <b>${(Array.isArray(w) ? w : Object.values(w)).map(x => esc(x.name)).join(", ")}</b></p>`; }).join("");
    const flashHTML = `<p class="flash ${S.flash ? S.flash.tone : ""}" aria-live="polite">${S.flash ? esc(S.flash.text) : ""}</p>`;
    let body;
    if (st.phase === "lobby" && (!S.card || S.editing)) {
      const big = cfg.hi - cfg.lo > 41, full = S.draft.every(v => v != null);
      body = `<h2>Make your card</h2><p class="muted" style="margin:0">${esc(cfg.title)}. Pick 9 numbers from ${cfg.lo} to ${cfg.hi}. Repeats are allowed.</p>
        <div class="pcard">${S.draft.map((v, i) => `<button type="button" class="cell ${v == null ? "empty" : ""} ${i === S.sel ? "sel" : ""}" data-cell="${i}" aria-label="Square ${i + 1}${v == null ? ", empty" : ", " + v}">${v == null ? "" : v}</button>`).join("")}</div>
        ${big ? `<div class="row"><input id="numIn" inputmode="numeric" placeholder="${cfg.lo}–${cfg.hi}" value="${esc(S.typed)}" style="flex:1"><button type="button" class="go" id="numGo" style="flex:0 0 auto;width:auto;padding:12px 20px;font-size:24px">Add</button></div>`
          : `<div class="keys">${Array.from({length: cfg.hi - cfg.lo + 1}, (_, k) => cfg.lo + k).map(v => `<button type="button" data-key="${v}">${v}</button>`).join("")}</div>`}
        ${flashHTML}
        <div class="row"><button type="button" class="link" id="clr">Clear</button><button type="button" class="go" id="lockIn" ${full ? "" : "disabled"}>Lock in my card</button></div>`;
    } else if (st.phase === "lobby") {
      body = `<h2>Card ready ✓</h2><p class="muted" style="margin:0">Waiting for the first roll. Your card locks when it starts.</p>
        <div class="pcard">${S.card.map(v => `<div class="cell">${v}</div>`).join("")}</div>
        <button type="button" class="link" id="edit">Change my card</button>`;
    } else if (!S.card) {
      body = `${prizeLine}<div class="card call"><span>Last call</span><span class="num">${st.last}</span></div>
        <p class="msg">This game started before you made a card. You'll play the next one.</p>${winners}`;
    } else {
      const miss = missedCells(), over = st.phase === "over";
      body = `${over ? `<div class="results"><p><b>Game over</b></p>${winners.replace(/class="muted" /g, "")}</div>` : prizeLine}
        <div class="card call"><span><b>${over ? "Final call" : "Call " + st.ncalls}</b><br><span class="muted">${over ? `${st.ncalls} numbers rolled` : "Tap it if it's on your card"}</span></span><span class="num">${st.last}</span></div>
        <div class="pcard">${S.card.map((v, i) => { const m = markOf(i); return `<button type="button" class="cell ${S.marks[i] ? "hit" : m ? "hit pending" : miss[i] ? "miss" : ""} ${S.shake === i ? "shake" : ""}" data-mark="${i}" aria-label="${v}${m ? ", marked" : miss[i] ? ", missed" : ""}">${v}</button>`; }).join("")}</div>
        ${flashHTML}
        <div class="legend"><span><i style="background:var(--good)"></i>Marked</span><span><i style="border:2px dashed var(--bad)"></i>Missed</span></div>${over ? "" : winners}`;
    }
    app.innerHTML = `${top}${body}`;
    app.querySelectorAll("[data-cell]").forEach(b => b.onclick = () => { S.sel = +b.dataset.cell; render(); });
    const put = v => { S.draft[S.sel] = v; const nxt = S.draft.indexOf(null); if (nxt >= 0) S.sel = nxt; S.flash = null; render(); };
    app.querySelectorAll("[data-key]").forEach(b => b.onclick = () => put(+b.dataset.key));
    const ni = $("#numIn");
    if (ni) {
      const add = () => { const v = parseInt(ni.value, 10); if (!(v >= cfg.lo && v <= cfg.hi)) return flash(`Pick a number from ${cfg.lo} to ${cfg.hi}.`, "bad"); S.typed = ""; put(v); setTimeout(() => { const n2 = $("#numIn"); if (n2) n2.focus(); }, 0); };
      ni.oninput = () => { S.typed = ni.value; }; ni.onkeydown = e => { if (e.key === "Enter") add(); }; $("#numGo").onclick = add;
    }
    const clr = $("#clr"); if (clr) clr.onclick = () => { S.draft = Array(9).fill(null); S.sel = 0; render(); };
    const lock = $("#lockIn"); if (lock) lock.onclick = () => {
      lock.disabled = true;
      Live.player.setCard(S.draft.slice()).then(() => { S.editing = false; S.flash = null; render(); })
        .catch(() => flash("Too late: the game has started. You'll play the next one.", "bad"));
    };
    const ed = $("#edit"); if (ed) ed.onclick = () => { S.editing = true; S.draft = S.card.slice(); S.sel = 0; render(); };
    app.querySelectorAll("[data-mark]").forEach(b => b.onclick = () => tapMark(+b.dataset.mark));
  }

  async function join(code, name, auto) {
    if (!window.Live) { S.err = "The page didn't load properly. Refresh and try again."; return render(); }
    S.code = Live.cleanCode(code); S.name = Live.cleanName(name); S.busy = true; S.err = ""; render();
    try {
      await Live.player.join(S.code, S.name);
      store.set("code", S.code); store.set("name", S.name);
      S.busy = false; S.view = "in"; render();
      let seenMe = false;
      Live.player.onMe(me => {
        if (me) { seenMe = true; S.me = me; if (S.view === "in") render(); }
        else if (seenMe) { Live.player.leave(); S.view = "gone"; S.err = "Your teacher removed you from this game."; render(); }
      });
      Live.player.onState(st => {
        if (st === null) { Live.player.leave(); S.view = "gone"; S.err = "The game has ended. Thanks for playing!"; render(); return; }
        if (st.gameId !== S.gameId) {                     // a new game: start from your last card, ready to change it
          S.gameId = st.gameId; S.celebrated = {}; S.pending = {}; S.editing = false;
          const lo = st.cfg ? st.cfg.lo : 0, hi = st.cfg ? st.cfg.hi : 0, prev = S.card || S.draft;
          S.draft = prev.map(v => v != null && v >= lo && v <= hi ? v : null); S.sel = Math.max(0, S.draft.indexOf(null));
        }
        const asList = v => Array.isArray(v) ? v : v ? Object.keys(v).sort((x, y) => x - y).map(k => v[k]) : [];
        st.calls = asList(st.calls);
        if (st.winners) for (const k in st.winners) st.winners[k] = asList(st.winners[k]);
        if (S.state && st.callKey !== S.state.callKey) S.flash = null;
        S.state = st; celebrate(); if (S.view === "in") render();
      });
      Live.player.onCard(c => { S.card = c ? [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => c[i]) : null; if (S.view === "in") render(); });
      Live.player.onMarks(m => { S.marks = m || {}; Object.keys(S.pending).forEach(i => { if (S.marks[i]) delete S.pending[i]; }); if (S.view === "in") render(); });
    } catch (e) { S.busy = false; S.err = auto && e.message === "no-room" ? "" : errText(e); S.view = "form"; render(); }
  }

  render();
  // Coming back to this page (refresh, or the phone went to sleep): rejoin the same game automatically.
  if (params.get("code") === null && S.code && S.name && store.get("code") === S.code) join(S.code, S.name, true);
});
</script>
</body>
</html>
