<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B12">
<title>Join · The Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Phone page · Quiet Neon: one column, big touch targets, readable at arm's length. Glow only on what's live. */
:root{
  --paper:#070B12; --surface:#0C121D; --raised:#121B2A; --ink:#E6EEF6; --muted:#8C9BB0; --line:#22304A; --edge:#33445E; --grid:rgba(120,160,215,.06);
  --accent:#6FE3EE; --accent-ink:#04141A; --hi:#F4A259; --good:#6EE7A8; --bad:#FF6F7D; --on-light:#06090F; --me:#6FE3EE;
  --glow:0 0 18px rgba(111,227,238,.42),0 0 2px rgba(111,227,238,.6);
  --display:'Sora','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding:max(16px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:300;font-size:15px;letter-spacing:.34em;color:var(--ink)}
.brand svg{width:24px;height:24px;flex:0 0 auto}
h1{font-family:var(--display);font-weight:300;font-size:32px;line-height:1.1;margin:6px 0 0;letter-spacing:-.005em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
label,.label,.flabel{font-family:var(--num);font-weight:400;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;font-size:19px;font-weight:500;padding:13px 16px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);color:var(--ink);width:100%}
input:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
.go{font-family:var(--body);font-weight:600;font-size:19px;padding:16px;border:1px solid var(--accent);border-radius:14px;background:rgba(111,227,238,.1);color:var(--accent);width:100%;box-shadow:var(--glow),inset 0 0 12px rgba(111,227,238,.12)}
.go[disabled]{opacity:.45;box-shadow:none}
.link{background:none;border:0;color:var(--accent);font-weight:500;text-decoration:underline;padding:6px 0;align-self:flex-start}
.msg{margin:0;font-weight:500}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.muted{color:var(--muted)}
.big{font-family:var(--display);font-weight:300;font-size:40px;line-height:1.05;overflow-wrap:anywhere}
.you{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:12px 0 4px}
.you .av{width:96px;height:96px;filter:drop-shadow(0 0 12px var(--me))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);margin-right:6px;box-shadow:0 0 8px var(--good)}
.dot.off{background:var(--bad);box-shadow:none}
.wait{display:flex;gap:6px;justify-content:center;padding:8px 0}
.wait i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:var(--glow);animation:b 1.2s infinite ease-in-out}
.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.wait i{animation:none}}
/* the join form */
.form{display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:8px}
.codebox{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.codebox span{height:66px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:12px;background:var(--surface);font-family:var(--num);font-weight:500;font-size:30px;transition:border-color .15s,box-shadow .15s}
.codebox span.cur{border-color:var(--accent);box-shadow:var(--glow)}
.codebox span.ph{color:#3A4B63}
.codebox input{position:absolute;inset:0;opacity:0;font-size:16px;cursor:text;caret-color:transparent;border:0;padding:0;height:100%}
.pick{display:grid;gap:8px}
.pick.lights{grid-template-columns:repeat(6,minmax(0,1fr))}
.pick.shapes{grid-template-columns:repeat(5,minmax(0,1fr))}
.pick button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent;transition:border-color .15s,box-shadow .15s,background .15s}
.pick.lights button{border-radius:25px;border-color:transparent;background:transparent}
.pick.lights button i{width:24px;height:24px;border-radius:50%;background:var(--c);display:block;opacity:.85}
.pick.lights button[aria-checked="true"]{border:2px solid var(--c)}
.pick.lights button[aria-checked="true"] i{opacity:1;box-shadow:0 0 14px var(--c)}
.pick.shapes button svg{width:26px;height:26px}
.pick.shapes button path{stroke:var(--muted)}
.pick.shapes button[aria-checked="true"]{border-color:var(--me);background:color-mix(in srgb,var(--me) 9%,var(--surface));box-shadow:0 0 16px color-mix(in srgb,var(--me) 40%,transparent)}
.pick.shapes button[aria-checked="true"] path{stroke:var(--me)}
/* game screens fill the phone exactly: no scrolling, the card takes whatever space is left */
body.fit{height:100vh;height:100dvh;overflow:hidden;padding-bottom:max(12px,env(safe-area-inset-bottom))}
body.fit .app{height:100%;gap:10px}
body.fit h2{font-size:26px}
body.fit .go{font-size:18px;padding:12px 14px;white-space:nowrap}
body.fit .keys{gap:5px}
@media (max-height:620px){body.fit .keys button{padding:4px 0;font-size:17px} body.fit h2{font-size:22px} body.fit .app{gap:7px} body.fit .flash{font-size:14px} body.fit .sub{font-size:13px}}
.pwrap{flex:1 1 0;min-height:110px;container-type:size;display:grid;place-items:center}
.pwrap .pcard{width:min(100cqw,100cqh);height:min(100cqw,100cqh);grid-template-rows:repeat(3,1fr);gap:2.6cqmin}
.pwrap .cell{aspect-ratio:auto;width:100%;height:100%;font-size:min(12cqmin,52px);border-radius:min(4.5cqmin,16px)}
.sub{margin:0;font-size:15px;color:var(--muted);line-height:1.35}
.wins{margin:0;font-size:15px;color:var(--muted);text-align:center}
.wins b{color:var(--ink)}
.team{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14px;padding:4px 10px;border-radius:999px;border:1px solid var(--tc);color:var(--ink)}
.team::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tc);box-shadow:0 0 8px var(--tc)}
.top .right{display:flex;gap:8px;align-items:center}
.top .me{width:22px;height:22px;filter:drop-shadow(0 0 6px var(--me))}
/* ---------- bingo on the phone ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pts{font-family:var(--num);font-weight:500;font-size:16px;padding:4px 12px;border-radius:999px;border:1px solid var(--accent);color:var(--accent)}
h2{font-family:var(--display);font-weight:300;font-size:30px;line-height:1.05;margin:0}
.prize{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--accent);font-weight:500}
.card.call{flex-direction:row;padding:12px 18px;align-items:center;justify-content:space-between;gap:12px}
.call{padding:12px 18px}.call .num{font-family:var(--num);font-weight:500;font-size:52px;line-height:.9;color:var(--accent);text-shadow:0 0 22px rgba(111,227,238,.5)}
.results{display:grid;gap:4px;padding:12px 14px;border-radius:12px;border:1px solid var(--hi);background:rgba(244,162,89,.1);color:var(--ink)}.results p{margin:0}
.pcard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{aspect-ratio:1;border:1.5px solid var(--edge);border-radius:16px;background:var(--surface);color:var(--ink);font-family:var(--num);font-weight:500;font-size:clamp(30px,10vw,46px);display:grid;place-items:center;position:relative;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cell.empty{border-style:dashed;border-color:var(--line);color:var(--muted)}
.cell.sel{border-color:var(--accent);box-shadow:var(--glow)}
.cell.hit{background:var(--good);border-color:var(--good);color:var(--on-light);box-shadow:0 0 18px rgba(110,231,168,.45)}
.cell.hit::after{content:"";position:absolute;inset:18%;border-radius:50%;border:3px solid rgba(6,9,15,.45)}
.cell.pending{background:color-mix(in srgb,var(--good) 45%,var(--surface))}
.cell.miss{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keys button{font-family:var(--num);font-weight:500;font-size:19px;padding:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.keys button:active{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;align-items:center}
.row .go{flex:1}
.flash{margin:0;min-height:1.45em;font-weight:500;text-align:center;font-size:15px;line-height:1.45}
.flash.tip{color:var(--muted);font-weight:400}
.flash.bad{color:var(--bad)} .flash.good{color:var(--good)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,5,9,.85);z-index:10;padding:20px;text-align:center}
.win div{background:#0A0F18;color:var(--hi);border:1px solid var(--hi);border-radius:24px;padding:28px 26px;font-family:var(--display);font-weight:300;font-size:46px;line-height:1.05;box-shadow:0 0 40px rgba(244,162,89,.45);text-shadow:0 0 22px rgba(244,162,89,.5);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.win small{display:block;font-family:var(--num);font-size:18px;margin-top:12px;color:var(--ink);text-shadow:none}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
/* ---------- skunk on the phone ---------- */
.sk-track{display:flex;gap:6px;justify-content:center}
.sk-track span{width:44px;height:44px;display:grid;place-items:center;font-family:var(--display);font-weight:300;font-size:24px;border:1px solid var(--line);border-radius:10px;color:var(--muted);background:var(--surface)}
.sk-track span.cur{border-color:var(--accent);color:var(--accent);box-shadow:var(--glow)}
.sk-track span.done{opacity:.4;text-decoration:line-through}
.sk-big{font-family:var(--num);font-weight:500;font-size:clamp(56px,12vh,108px);line-height:.95;font-variant-numeric:tabular-nums}
.sk-box{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px}
.sk-box h2{margin:0}
.sk-box.sat{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface))} .sk-box.sat .sk-big{color:var(--good);text-shadow:0 0 24px rgba(110,231,168,.45)}
.sk-box.bust{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--surface))} .sk-box.bust .sk-big{color:var(--bad);font-size:clamp(46px,10vh,92px)}
.sk-box.win{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 9%,var(--surface));box-shadow:0 0 30px rgba(244,162,89,.3)}
.sk-box.stand .sk-big{font-family:var(--display);font-weight:300;font-size:clamp(44px,9vh,80px)}
.sk-pot{display:flex;align-items:baseline;justify-content:center;gap:14px}
.sit{flex:1;min-height:120px;border:1px solid var(--good);border-radius:22px;background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good);font-family:var(--display);font-weight:400;font-size:clamp(40px,8vh,64px);line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;touch-action:manipulation;box-shadow:0 0 30px rgba(110,231,168,.35),inset 0 0 22px rgba(110,231,168,.12)}
.sit small{font-family:var(--num);font-weight:400;font-size:15px;opacity:.95;color:var(--ink)}
.sit:active{transform:scale(.98);background:color-mix(in srgb,var(--good) 24%,var(--surface))}
.sit[disabled]{border-color:var(--line);background:var(--surface);color:var(--muted);box-shadow:none}
.sk-foot{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.sk-foot b{color:var(--ink);font-family:var(--num);font-weight:500;font-size:18px}
.sk-foot b.one{color:var(--bad)} .sk-foot b.dbl{color:var(--good)}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" defer></script>
<script src="js/firebase-config.js?v=2026-11-22g" defer></script>
<script src="js/live.js?v=2026-11-22g" defer></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const store = {get(k) { try { return localStorage.getItem("mgr-join:" + k) || ""; } catch (e) { return ""; } },
                 set(k, v) { try { localStorage.setItem("mgr-join:" + k, v); } catch (e) {} }};
  const params = new URLSearchParams(location.search);
  const S = {view: "form", code: (params.get("code") || store.get("code") || "").toUpperCase().slice(0, 4), name: store.get("name"), err: "", busy: false, state: null, me: null,
             card: null, marks: {}, draft: Array(9).fill(null), sel: 0, editing: false, pending: {}, flash: null, celebrated: {}, gameId: null, typed: "", shake: -1,
             light: "", shape: ""};
  const GRID_VERSION = "2026-11-22g";
  const PRIZES = {line: ["a line", 1], corners: ["four corners", 2], full: ["a full house", 3]};
  const brand = `<div class="brand" aria-label="The Grid"><svg viewBox="0 0 120 120" aria-hidden="true"><rect x="3" y="3" width="114" height="114" rx="20" fill="none" stroke="#4A5D78" stroke-width="6"/><path d="M40.3 3V117M79.7 3V117M3 40.3H117M3 79.7H117" stroke="#4A5D78" stroke-width="6"/><rect x="82" y="8" width="30" height="30" rx="6" fill="#6FE3EE"/></svg><span aria-hidden="true">GRID</span></div>`;
  /* your light and your shape: shown on the projector next to your name ("grid creatures") */
  const LIGHTS = [["ice", "Ice", "#6FE3EE"], ["ember", "Ember", "#F4A259"], ["iris", "Iris", "#A79BFF"], ["jade", "Jade", "#6EE7A8"], ["rose", "Rose", "#FF7EA8"], ["sun", "Sun", "#F2D46B"]];
  const SHAPES = [["hex", "Hexagon", "M12 2.5L20.5 7.25V16.75L12 21.5L3.5 16.75V7.25Z"], ["tri", "Triangle", "M12 3L21.5 20H2.5Z"], ["circle", "Circle", "M12 3a9 9 0 1 0 0.01 0Z"], ["square", "Square", "M4.5 4.5H19.5V19.5H4.5Z"], ["diamond", "Diamond", "M12 2.5L21.5 12L12 21.5L2.5 12Z"]];
  const pickOr = (v, list) => list.some(x => x[0] === v) ? v : list[Math.floor(Math.random() * list.length)][0];
  const lightHex = k => (LIGHTS.find(x => x[0] === k) || LIGHTS[0])[2];
  const shapeSVG = (k, cls = "av") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${(SHAPES.find(x => x[0] === k) || SHAPES[0])[2]}" fill="none" stroke="${lightHex(S.light)}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  S.light = pickOr(store.get("light"), LIGHTS); S.shape = pickOr(store.get("shape"), SHAPES);
  const setMe = () => document.documentElement.style.setProperty("--me", lightHex(S.light));
  setMe();
  const avatar = () => S.shape + ":" + S.light;
  const meTop = () => shapeSVG(S.shape, "me");
  const ERR = {
    "not-configured": "Live play isn't set up yet. Ask your teacher.",
    "sdk-blocked": "Couldn't reach the game server. The Wi-Fi may be blocking it. Try mobile data.",
    "timeout": "The game server didn't answer. Check your connection and try again.",
    "no-room": "No game with that code. Check the code on the board.",
    "bad-code": "The code is 4 letters. Check the board.",
    "no-name": "Type your name first.",
  };
  const errText = e => ERR[e && e.message] || "Something went wrong. Try again.";

  function render() {
    const app = $("#app");
    document.body.classList.toggle("fit", S.view === "in" && !!S.state && (S.state.game === "bingo" || S.state.game === "skunk"));
    if (S.view === "form") {
      const ch = S.code.padEnd(4).split("");
      app.innerHTML = `${brand}<h1>Get on the Grid</h1>
        <form class="form" id="f" autocomplete="off">
          <div class="field"><label for="code">Room code</label>
            <div class="codebox" id="codebox">${ch.map((c, i) => `<span class="${c.trim() ? "" : "ph"}" aria-hidden="true">${c.trim() ? esc(c) : "·"}</span>`).join("")}
              <input id="code" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="4" value="${esc(S.code)}" aria-label="Room code, 4 letters" required></div></div>
          <div class="field"><label for="name">Your name</label><input id="name" maxlength="16" value="${esc(S.name)}" placeholder="First name" required></div>
          <div class="field"><span class="flabel" id="lightL">Your light</span>
            <div class="pick lights" role="radiogroup" aria-labelledby="lightL">${LIGHTS.map(([k, n, c]) => `<button type="button" role="radio" aria-checked="${S.light === k}" aria-label="${n}" data-light="${k}" style="--c:${c}"><i></i></button>`).join("")}</div></div>
          <div class="field"><span class="flabel" id="shapeL">Your shape</span>
            <div class="pick shapes" role="radiogroup" aria-labelledby="shapeL">${SHAPES.map(([k, n, d]) => `<button type="button" role="radio" aria-checked="${S.shape === k}" aria-label="${n}" data-shape="${k}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}" fill="none" stroke-width="1.8" stroke-linejoin="round"/></svg></button>`).join("")}</div></div>
          ${S.err ? `<p class="msg bad">${esc(S.err)}</p>` : ""}
          <button class="go" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "Joining…" : "Join"}</button>
        </form>`;
      const ci = $("#code"), boxes = [...app.querySelectorAll("#codebox span")];
      const showCode = () => { const v = ci.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); if (ci.value !== v) ci.value = v; S.code = v;
        boxes.forEach((b, i) => { b.textContent = v[i] || "·"; b.classList.toggle("ph", !v[i]); b.classList.toggle("cur", document.activeElement === ci && i === Math.min(v.length, 3)); }); };
      ci.oninput = showCode; ci.onfocus = showCode; ci.onblur = showCode;
      $("#name").oninput = e => { S.name = e.target.value; };
      app.querySelectorAll("[data-light]").forEach(b => b.onclick = () => { S.light = b.dataset.light; store.set("light", S.light); setMe(); app.querySelectorAll("[data-light]").forEach(x => x.setAttribute("aria-checked", x === b)); });
      app.querySelectorAll("[data-shape]").forEach(b => b.onclick = () => { S.shape = b.dataset.shape; store.set("shape", S.shape); app.querySelectorAll("[data-shape]").forEach(x => x.setAttribute("aria-checked", x === b)); });
      $("#f").onsubmit = e => { e.preventDefault(); join(ci.value, $("#name").value); };
      if (!S.code) ci.focus(); else if (!S.name) $("#name").focus();
    } else if (S.view === "in" && S.state && S.state.game === "bingo") {
      renderBingo(app);
    } else if (S.view === "in" && S.state && S.state.game === "skunk") {
      renderSkunk(app);
    } else if (S.view === "in") {
      const st = S.state || {}, online = S.me && S.me.online !== false;
      const tm = myTeam();
      app.innerHTML = `<div class="top">${brand}<span class="right">${tm ? `<span class="team" style="--tc:${tm.colour}">${esc(tm.name)}</span>` : ""}${S.me && S.me.score ? `<span class="pts">${S.me.score} ${S.me.score === 1 ? "pt" : "pts"}</span>` : ""}${meTop()}</span></div>
        <div class="card"><div class="you">${shapeSVG(S.shape)}<span class="big">${esc(S.me ? S.me.name : S.name)}</span><span class="muted"><span class="dot ${online ? "" : "off"}"></span>${online ? `You're on the Grid · ${esc(S.code)}` : "Reconnecting"}</span></div></div>
        <div class="card"><p class="msg">${st.phase === "lobby" || !st.game ? "Watch the board. The game will start soon." : "The game is running. Watch the board."}</p><div class="wait" aria-hidden="true"><i></i><i></i><i></i></div></div>
        <button class="link" id="leave" type="button">Leave this game</button>`;
      $("#leave").onclick = async () => { await Live.player.leave(); S.view = "form"; S.err = ""; render(); };
    } else if (S.view === "gone") {
      app.innerHTML = `${brand}<div class="card"><p class="msg">${esc(S.err)}</p><button class="go" id="again" type="button">Join a game</button></div>`;
      $("#again").onclick = () => { S.view = "form"; S.err = ""; render(); };
    }
  }

  /* ---------- bingo ---------- */
  const markOf = i => S.marks[i] || S.pending[i] || null;
  function myTeam() {                         // set by the projector when it plays in teams
    const T = S.state && S.state.teams; if (!T || !T.of || T.of[Live.uid] == null) return null;
    const i = T.of[Live.uid], names = Array.isArray(T.names) ? T.names : Object.values(T.names || {}), cols = Array.isArray(T.colours) ? T.colours : Object.values(T.colours || {});
    return names[i] ? {name: names[i], colour: cols[i] || "var(--accent)"} : null;
  }
  function missedCells() {                    // numbers called before this one that you didn't mark in time
    const st = S.state, out = Array(9).fill(false); if (!S.card || !st.calls) return out;
    const cnt = {}; st.calls.slice(0, -1).forEach(v => cnt[v] = (cnt[v] || 0) + 1);
    S.card.forEach((v, i) => {
      if (markOf(i) || !cnt[v]) return;
      const marked = S.card.filter((w, j) => w === v && markOf(j)).length, before = S.card.slice(0, i).filter((w, j) => w === v && !markOf(j)).length;
      if (cnt[v] - marked > before) out[i] = true;
    });
    return out;
  }
  function celebrate() {
    const st = S.state; if (!st || !st.winners) return;
    for (const k of Object.keys(PRIZES)) {
      const w = st.winners[k]; if (!w || S.celebrated[k]) continue;
      S.celebrated[k] = true;
      if ((Array.isArray(w) ? w : Object.values(w)).some(x => x && x.id === Live.uid)) {
        const el = document.createElement("div"); el.className = "win";
        el.innerHTML = `<div>${k === "full" ? "BINGO!" : k === "corners" ? "Four corners!" : "A line!"}<small>+${PRIZES[k][1]} ${PRIZES[k][1] === 1 ? "point" : "points"}</small></div>`;
        document.body.appendChild(el); setTimeout(() => el.remove(), 3500); el.onclick = () => el.remove();
        try { navigator.vibrate && navigator.vibrate([120, 60, 120, 60, 240]); } catch (e) {}
      }
    }
  }
  function flash(text, tone, cell) { S.flash = {text, tone}; S.shake = cell == null ? -1 : cell; render(); S.shake = -1; }
  function tapMark(i) {
    const st = S.state;
    if (st.phase !== "playing" || !S.card || markOf(i)) return;
    if (S.card[i] !== st.last) return flash(`${S.card[i]} hasn't just been called. The last number was ${st.last}.`, "bad", i);
    if (Object.values(S.marks).includes(st.callKey) || Object.values(S.pending).includes(st.callKey)) return flash("You've already marked this number once.", "bad", i);
    S.pending[i] = st.callKey; S.flash = null; render();
    Live.player.mark(i, st.callKey).catch(() => { delete S.pending[i]; flash("Too late: the next number had already been rolled.", "bad", i); });
  }
  function renderBingo(app) {
    const st = S.state, cfg = st.cfg || {lo: 1, hi: 6, title: ""}, me = S.me || {}, pts = me.score || 0;
    const tm = myTeam();
    const top = `<div class="top">${brand}<span class="right">${tm ? `<span class="team" style="--tc:${tm.colour}">${esc(tm.name)}</span>` : ""}<span class="pts">${pts} ${pts === 1 ? "pt" : "pts"}</span>${meTop()}</span></div>`;
    const winList = Object.keys(PRIZES).filter(k => st.winners && st.winners[k]).map(k => { const w = st.winners[k]; return `${PRIZES[k][0][0].toUpperCase() + PRIZES[k][0].slice(1)}: <b>${(Array.isArray(w) ? w : Object.values(w)).map(x => esc(x.name)).join(", ")}</b>`; });
    const winners = winList.length ? `<p class="wins">${winList.join(" · ")}</p>` : "";
    const flashHTML = (tip = "") => `<p class="flash ${S.flash ? S.flash.tone : "tip"}" aria-live="polite">${S.flash ? esc(S.flash.text) : tip}</p>`;
    const wrap = inner => `<div class="pwrap"><div class="pcard">${inner}</div></div>`;
    let body;
    if (st.phase === "lobby" && (!S.card || S.editing)) {
      const big = cfg.hi - cfg.lo > 41, full = S.draft.every(v => v != null);
      body = `<h2>Make your card</h2><p class="sub">${esc(cfg.title)}: pick 9 numbers from ${cfg.lo} to ${cfg.hi}. Repeats are allowed.</p>
        ${wrap(S.draft.map((v, i) => `<button type="button" class="cell ${v == null ? "empty" : ""} ${i === S.sel ? "sel" : ""}" data-cell="${i}" aria-label="Square ${i + 1}${v == null ? ", empty" : ", " + v}">${v == null ? "" : v}</button>`).join(""))}
        ${big ? `<div class="row"><input id="numIn" inputmode="numeric" placeholder="${cfg.lo}–${cfg.hi}" value="${esc(S.typed)}" style="flex:1"><button type="button" class="go" id="numGo" style="flex:0 0 auto;width:auto;padding:12px 20px;font-size:24px">Add</button></div>`
          : `<div class="keys">${Array.from({length: cfg.hi - cfg.lo + 1}, (_, k) => cfg.lo + k).map(v => `<button type="button" data-key="${v}">${v}</button>`).join("")}</div>`}
        ${flashHTML("Tap a square, then a number.")}
        <div class="row"><button type="button" class="link" id="clr">Clear</button><button type="button" class="go" id="lockIn" ${full ? "" : "disabled"}>Lock in my card</button></div>`;
    } else if (st.phase === "lobby") {
      body = `<h2>Card ready</h2><p class="sub">Waiting for the first roll. Your card locks when it starts.</p>
        ${wrap(S.card.map(v => `<div class="cell">${v}</div>`).join(""))}
        <button type="button" class="link" id="edit">Change my card</button>`;
    } else if (!S.card) {
      body = `<div class="card call"><span><b>Last call</b></span><span class="num">${st.last}</span></div>
        <p class="msg">This game started before you made a card. You'll play the next one.</p>${winners}`;
    } else {
      const miss = missedCells(), over = st.phase === "over";
      const open = (Array.isArray(st.open) ? st.open : st.open ? Object.values(st.open) : st.prize && st.prize !== "done" ? [st.prize] : []).filter(k => PRIZES[k]);
      body = `${over ? `<div class="results"><p><b>Game over</b></p>${winList.map(w => `<p>${w}</p>`).join("")}</div>` : ""}
        <div class="card call"><span><b>${over ? "Final call" : "Call " + st.ncalls}</b><br><span class="muted">${over ? `${st.ncalls} numbers rolled` : open.length ? "Up for grabs: " + open.map(k => ({line: "line", corners: "corners", full: "full house"})[k]).join(" · ") : ""}</span></span><span class="num">${st.last}</span></div>
        ${wrap(S.card.map((v, i) => { const m = markOf(i); return `<button type="button" class="cell ${S.marks[i] ? "hit" : m ? "hit pending" : miss[i] ? "miss" : ""} ${S.shake === i ? "shake" : ""}" data-mark="${i}" aria-label="${v}${m ? ", marked" : miss[i] ? ", missed" : ""}">${v}</button>`; }).join(""))}
        ${flashHTML(over ? "" : miss.some(Boolean) ? "Red dashed squares are numbers you missed." : "Tap the number if it's on your card.")}
        ${over ? "" : winners}`;
    }
    app.innerHTML = `${top}${body}`;
    app.querySelectorAll("[data-cell]").forEach(b => b.onclick = () => { S.sel = +b.dataset.cell; render(); });
    const put = v => { S.draft[S.sel] = v; const nxt = S.draft.indexOf(null); if (nxt >= 0) S.sel = nxt; S.flash = null; render(); };
    app.querySelectorAll("[data-key]").forEach(b => b.onclick = () => put(+b.dataset.key));
    const ni = $("#numIn");
    if (ni) {
      const add = () => { const v = parseInt(ni.value, 10); if (!(v >= cfg.lo && v <= cfg.hi)) return flash(`Pick a number from ${cfg.lo} to ${cfg.hi}.`, "bad"); S.typed = ""; put(v); setTimeout(() => { const n2 = $("#numIn"); if (n2) n2.focus(); }, 0); };
      ni.oninput = () => { S.typed = ni.value; }; ni.onkeydown = e => { if (e.key === "Enter") add(); }; $("#numGo").onclick = add;
    }
    const clr = $("#clr"); if (clr) clr.onclick = () => { S.draft = Array(9).fill(null); S.sel = 0; render(); };
    const lock = $("#lockIn"); if (lock) lock.onclick = () => {
      lock.disabled = true;
      Live.player.setCard(S.draft.slice()).then(() => { S.editing = false; S.flash = null; render(); })
        .catch(() => flash("Too late: the game has started. You'll play the next one.", "bad"));
    };
    const ed = $("#edit"); if (ed) ed.onclick = () => { S.editing = true; S.draft = S.card.slice(); S.sel = 0; render(); };
    app.querySelectorAll("[data-mark]").forEach(b => b.onclick = () => tapMark(+b.dataset.mark));
  }

  /* ---------- skunk ---------- */
  const LETTERS = ["S", "K", "U", "N", "K"];
  function renderSkunk(app) {
    const st = S.state, pl = st.pl || {}, me = pl[Live.uid], pts = (S.me && S.me.score) || 0, tm = myTeam();
    if (S.sitKey && (!me || me.s !== "standing" || !String(S.sitKey).startsWith("r" + st.round + "c"))) S.sitKey = null;
    const top = `<div class="top">${brand}<span class="right">${tm ? `<span class="team" style="--tc:${tm.colour}">${esc(tm.name)}</span>` : ""}<span class="pts">${pts} ${pts === 1 ? "pt" : "pts"}</span>${meTop()}</span></div>`;
    const track = `<div class="sk-track">${LETTERS.map((L, i) => `<span class="${i === st.round && st.phase !== "over" ? "cur" : i < st.round || st.phase === "over" ? "done" : ""}">${L}</span>`).join("")}</div>`;
    const lastRoll = st.last ? (Array.isArray(st.last) ? st.last : Object.values(st.last)) : null;
    const dbl = lastRoll && lastRoll[0] === lastRoll[1] && lastRoll[0] !== 1;
    const rollTxt = lastRoll ? `Last roll <b class="${lastRoll.includes(1) ? "one" : dbl ? "dbl" : ""}">${lastRoll[0]} + ${lastRoll[1]}${dbl ? " · double!" : ""}</b>` : "No rolls yet";
    const total = me ? me.t : 0;
    const foot = `<div class="sk-foot"><span>Your total <b>${total}</b></span><span>${rollTxt}</span></div>`;
    const flashHTML = `<p class="flash ${S.flash ? S.flash.tone : "tip"}" aria-live="polite">${S.flash ? esc(S.flash.text) : ""}</p>`;
    let body;
    if (!me) body = `<div class="sk-box"><h2>Skunk</h2><p class="sub">You'll join in from the next round. Watch the board.</p></div>`;
    else if (st.phase === "over") {
      const list = Object.values(pl).map(p => p.t), place = 1 + list.filter(t => t > me.t).length;
      body = `<div class="sk-box ${place === 1 && me.t > 0 ? "win" : ""}"><span class="label">Game over</span><span class="sk-big">${ordinal(place)}</span><p class="sub">with ${me.t} ${me.t === 1 ? "point" : "points"}${place <= 3 && me.t > 0 ? ` · +${4 - place} on the leaderboard` : ""}</p></div>`;
    } else if (me.s === "waiting") body = `<div class="sk-box"><h2>Next round</h2><p class="sub">You joined mid-round, so you'll stand up for the next one.</p></div>`;
    else if (me.s === "sat") body = `<div class="sk-box sat"><span class="label">You sat down with</span><span class="sk-big">+${me.b}</span><p class="sub">${st.phase === "playing" ? "Safe for this round. Watch the others sweat." : "Round over. Stand up when the next one starts."}</p></div>`;
    else if (me.s === "bust") body = `<div class="sk-box bust"><span class="label">A one!</span><span class="sk-big">${me.b ? "−" + me.b : "0"}</span><p class="sub">You were still standing, so you lose this round's pot.</p></div>`;
    else if (me.s === "skunked") body = `<div class="sk-box bust"><span class="label">Double one! Skunked</span><span class="sk-big">${me.b ? "−" + me.b : "0"}</span><p class="sub">You were still standing, so your whole total is wiped.</p></div>`;
    else if (st.phase !== "playing") body = `<div class="sk-box"><h2>Round over</h2><p class="sub">Get ready to stand up again.</p></div>`;
    else if (!st.pot) body = `<div class="sk-box stand"><span class="label">Round ${LETTERS[st.round] || ""}</span><span class="sk-big">Stand up!</span><p class="sub">Waiting for the first roll. It's always safe, and doubles score double.</p></div>`;
    else {
      const open = !!st.askKey, pending = S.sitKey && S.sitKey === st.askKey;
      body = `<div class="sk-pot"><span class="label">Pot</span><span class="sk-big">${st.pot}</span></div>
        <button type="button" class="sit" id="sit" ${open && !pending ? "" : "disabled"}>${pending ? "Sitting down…" : open ? `Sit down<small>Bank ${st.pot} · total ${total + st.pot}</small>` : "Dice rolling…"}</button>
        <p class="sub" style="text-align:center">A 1 loses ${st.pot}. A double 1 loses ${st.pot + total}.</p>`;
    }
    app.innerHTML = `${top}${track}${body}${flashHTML}${foot}`;
    const sit = $("#sit");
    if (sit) sit.onclick = () => {
      const key = st.askKey; if (!key) return;
      S.sitKey = key; S.flash = null; render();
      Live.player.answer(key, "sit").catch(() => {
        S.sitKey = null;
        if (S.state && S.state.askKey === key) flash("Couldn't send that. Ask your teacher to update the Grid's database rules.", "bad");
        else flash("Too late: the dice were already thrown.", "bad");
      });
    };
  }
  const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");

  async function join(code, name, auto) {
    if (!window.Live) { S.err = "The page didn't load properly. Refresh and try again."; return render(); }
    S.code = Live.cleanCode(code); S.name = Live.cleanName(name); S.busy = true; S.err = ""; render();
    try {
      await Live.player.join(S.code, S.name, avatar());
      store.set("code", S.code); store.set("name", S.name);
      S.busy = false; S.view = "in"; render();
      let seenMe = false;
      Live.player.onMe(me => {
        if (me) { seenMe = true; S.me = me; if (S.view === "in") render(); }
        else if (seenMe) { Live.player.leave(); S.view = "gone"; S.err = "Your teacher removed you from this game."; render(); }
      });
      Live.player.onState(st => {
        if (st && st.v && st.v !== GRID_VERSION && sessionStorage.getItem("grid-reload") !== st.v) {   // this phone has an old copy of the page
          sessionStorage.setItem("grid-reload", st.v);
          const u = new URL(location.href); u.searchParams.set("v", st.v); u.searchParams.delete("code"); location.replace(u.href); return;   // no code in the link, so it rejoins by itself
        }
        if (st === null) { Live.player.leave(); S.view = "gone"; S.err = "The game has ended. Thanks for playing!"; render(); return; }
        if (st.gameId !== S.gameId) {                     // a new game: start from your last card, ready to change it
          S.gameId = st.gameId; S.celebrated = {}; S.pending = {}; S.editing = false;
          const lo = st.cfg ? st.cfg.lo : 0, hi = st.cfg ? st.cfg.hi : 0, prev = S.card || S.draft;
          S.draft = prev.map(v => v != null && v >= lo && v <= hi ? v : null); S.sel = Math.max(0, S.draft.indexOf(null));
        }
        const asList = v => Array.isArray(v) ? v : v ? Object.keys(v).sort((x, y) => x - y).map(k => v[k]) : [];
        st.calls = asList(st.calls);
        if (st.winners) for (const k in st.winners) st.winners[k] = asList(st.winners[k]);
        if (S.state && st.callKey !== S.state.callKey) S.flash = null;
        S.state = st; celebrate(); if (S.view === "in") render();
      });
      Live.player.onCard(c => { S.card = c ? [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => c[i]) : null; if (S.view === "in") render(); });
      Live.player.onMarks(m => { S.marks = m || {}; Object.keys(S.pending).forEach(i => { if (S.marks[i]) delete S.pending[i]; }); if (S.view === "in") render(); });
    } catch (e) { S.busy = false; S.err = auto && e.message === "no-room" ? "" : errText(e); S.view = "form"; render(); }
  }

  render();
  // Coming back to this page (refresh, or the phone went to sleep): rejoin the same game automatically.
  if (params.get("code") === null && S.code && S.name && store.get("code") === S.code) join(S.code, S.name, true);
});
</script>
</body>
</html>
