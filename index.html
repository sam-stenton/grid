<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=STIX+Two+Text:ital,wght@1,500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" defer></script>
<script src="js/firebase-config.js?v=2026-11-22c" defer></script>
<script src="js/live.js?v=2026-11-22c" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
/* Layout idea: an exercise-book grid as the stage, scoreboard docked along the bottom like a sports ticker; built to be read from the back of a classroom. */
:root{
  --paper:#F5F7FB; --surface:#FFFFFF; --ink:#131A2C; --muted:#56607A; --line:#D5DBE7;
  --grid:rgba(31,79,224,.075); --accent:#1F4FE0; --accent-ink:#FFFFFF; --hi:#FFD23F; --hi-ink:#131A2C;
  --good:#0E7F57; --bad:#C62828;
  --g0:#1F4FE0; --g1:#0E8F6E; --g2:#D9530A; --g3:#B8155A;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1320; --surface:#161D2E; --ink:#E9EDF6; --muted:#9BA5BB; --line:#2A3449;
    --grid:rgba(122,149,255,.08); --accent:#7C96FF; --accent-ink:#0E1320; --hi:#FFD23F; --hi-ink:#131A2C;
    --good:#3CC48C; --bad:#FF6B6B;
    --g0:#4A70FF; --g1:#17AE87; --g2:#F07A30; --g3:#E0457F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1320; --surface:#161D2E; --ink:#E9EDF6; --muted:#9BA5BB; --line:#2A3449;
  --grid:rgba(122,149,255,.08); --accent:#7C96FF; --accent-ink:#0E1320; --hi:#FFD23F; --hi-ink:#131A2C;
  --good:#3CC48C; --bad:#FF6B6B;
  --g0:#4A70FF; --g1:#17AE87; --g2:#F07A30; --g3:#E0457F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  display:grid;grid-template-rows:auto 1fr auto;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
sup,sub{font-size:.62em;line-height:0}
kbd{font-family:var(--body);font-size:.6em;border:1.5px solid currentColor;border-radius:5px;padding:1px 6px;opacity:.75;vertical-align:middle;margin-left:8px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:10px clamp(16px,3vw,32px);border-bottom:2px solid var(--ink);background:var(--surface)}
.brand{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand .mark{display:inline-grid;place-items:center;width:34px;height:34px;border:2.5px solid var(--ink);border-radius:8px;background:var(--hi);color:var(--hi-ink)}
.crumb{font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted)}
.topbar .spacer{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);font-weight:700;font-size:17px;line-height:1.1;text-decoration:none;color:var(--ink);transition:transform .08s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:var(--line)}
.btn.xl{font-family:var(--display);font-weight:800;font-size:34px;padding:14px 34px;border-radius:14px;letter-spacing:.03em}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;font-weight:700;color:var(--accent)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 14px;font-weight:700;font-size:16px;border-right:2px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}

/* ---------- page frame ---------- */
main{overflow:auto;padding:clamp(16px,2.5vw,32px)}
.game{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.game-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.game-head h1{font-size:clamp(40px,5vw,64px)}
.eyebrow{margin:0 0 4px;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:clamp(16px,2vw,26px);display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:30px}
.muted{color:var(--muted)}
.hint{color:var(--muted);margin:0;font-size:16px;max-width:60ch}
.big{font-family:var(--display);font-weight:900;font-size:clamp(90px,12vw,170px);line-height:.9;font-variant-numeric:tabular-nums}
.label{font-weight:700;color:var(--muted);font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.msg{font-size:22px;font-weight:700;margin:0;min-height:1.4em}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}

/* ---------- home ---------- */
.home{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;padding-top:8px}
.hero h1{font-size:clamp(56px,8vw,112px);font-weight:900;line-height:.86}
.hero h1 span{display:inline-block;background:var(--hi);color:var(--hi-ink);padding:0 .12em;transform:rotate(-1.5deg)}
.hero p{margin:0;font-size:19px;max-width:52ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px;background:var(--surface);border:2px solid var(--ink);border-radius:16px;text-decoration:none;color:var(--ink);box-shadow:5px 5px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease}
.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.card h2{font-size:38px}
.card p{margin:0;color:var(--muted)}
.card .go{margin-top:auto;font-weight:700;color:var(--accent)}
.card .glyph{position:absolute;right:18px;top:14px;font-family:var(--display);font-weight:900;font-size:44px;color:var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px}
.chip.g{background:var(--g1);border-color:var(--g1);color:#fff}
.chip.a{background:var(--g0);border-color:var(--g0);color:#fff}
.chip.f{background:var(--g3);border-color:var(--g3);color:#fff}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;border-top:2px solid var(--ink);padding-top:18px}
.howto div{display:flex;gap:12px}
.howto b.n{font-family:var(--display);font-size:40px;line-height:.9;color:var(--accent)}
.howto p{margin:0;color:var(--muted);font-size:16px}

/* ---------- dice ---------- */
.dice{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.die{width:clamp(70px,8vw,104px);aspect-ratio:1;background:var(--surface);border:3px solid var(--ink);border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:clamp(9px,1.1vw,14px);gap:3px;box-shadow:4px 4px 0 var(--ink)}
.die i{border-radius:50%}
.die i.p{background:var(--ink)}
.die.sm{width:34px;border-width:2px;box-shadow:none;padding:4px;gap:1px;border-radius:7px}
.die.one i.p{background:var(--bad)}
.tray{--k:1;--ds:calc(var(--k) * 100px);position:relative;width:100%;height:calc(var(--ds) * 2.1);display:flex;justify-content:center;align-items:flex-end;gap:calc(var(--ds) * .5);padding-bottom:16px;cursor:pointer;touch-action:manipulation}
.tray.rolling{cursor:progress}
.dslot{position:relative;width:var(--ds);height:var(--ds);perspective:650px;flex:0 0 auto}
.dshadow{position:absolute;left:6%;right:6%;bottom:-14px;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(10,15,30,.38),transparent)}
.dmove,.die3d{position:absolute;inset:0;transform-style:preserve-3d}
.dmove{transform-origin:50% 100%}
.dface{position:absolute;inset:0;border:3px solid var(--ink);border-radius:17%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:15%;gap:5%;backface-visibility:hidden;
  background:linear-gradient(150deg,var(--surface) 35%,color-mix(in srgb,var(--surface) 86%,var(--ink)))}
.dface i{border-radius:50%}
.dface i.p{background:var(--ink);box-shadow:inset 0 2px 2px rgba(0,0,0,.35)}
.tray.skunk .dface[data-n="1"] i.p{background:var(--bad)}
.pscale{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:scale3d(var(--k),var(--k),var(--k))}
.pface{position:absolute;backface-visibility:hidden;transform-origin:50% 50%}
.pface svg{width:100%;height:100%;overflow:visible;display:block}
.pface .pf{fill:var(--surface);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.pface .ps{fill:#0a0f1e;stroke:none}
.pface .pn{fill:var(--ink);font-family:var(--display);font-weight:900;text-anchor:middle;dominant-baseline:central}
.pface .pu{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.setbar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px 24px;padding:14px 18px}
.setbar .set-row{justify-content:flex-start}
.fr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;line-height:1.08;margin:0 .1em;font-size:.88em;text-align:center}
.fr>span{padding:0 .14em;white-space:nowrap}
.fr>span:first-child{border-bottom:max(1.5px,.07em) solid currentColor;padding-bottom:.05em}
.fr>span:last-child{padding-top:.06em}
.sqrt{white-space:nowrap}
.sqrt .rad{border-top:max(1.5px,.07em) solid currentColor;padding:.05em .06em 0 .04em}
.mv{font-family:'STIX Two Text','Cambria Math','Cambria','Times New Roman',serif;font-style:italic;font-weight:500;font-size:1.1em;line-height:1;padding-right:.05em}
.ss-info .fr{font-size:1em;font-family:var(--display);font-weight:800}
.two-col.bingo-cols{align-items:stretch}
/* app-style screens: the game fills the window between the top bar and the scoreboard, with no page scrolling */
.game.fit{height:100%;min-height:0;gap:14px}
.game.fit .game-head h1{font-size:clamp(34px,5vh,60px)}
.game.fit .two-col{flex:1;min-height:430px}
.game.fit .two-col>.panel{min-height:0;overflow:hidden;padding:clamp(14px,1.8vh,24px);gap:clamp(8px,1.4vh,14px)}
.game.fit .tray{height:min(calc(var(--ds) * 2.1),23vh);padding-bottom:12px}
.game.fit .big{font-size:clamp(56px,12.5vh,160px)}
.game.fit .btn.xl{padding:clamp(8px,1.2vh,14px) 32px;font-size:clamp(26px,3.6vh,34px)}
.game.fit .bview{flex:1;min-height:0}
.game.fit .bars{flex:1;min-height:130px;grid-template-rows:minmax(0,1fr) auto auto;align-items:stretch}
.game.fit .bar{height:auto;min-height:0}
.game.fit .history{max-height:38px;overflow:hidden}
.game.fit .ss{flex:1;min-height:0;overflow:auto;grid-auto-rows:minmax(var(--rmin,24px),1fr)!important}
.game.fit .ways{flex:1;min-height:0;max-height:none}
.game.fit .setbar{flex:0 0 auto}
@media (max-width:900px),(max-height:600px){
  .game.fit{height:auto}
  .game.fit .two-col>.panel{overflow:visible}
  .game.fit .bars{flex:none}
  .game.fit .bar{height:240px}
  .game.fit .ss{grid-auto-rows:40px!important}
}
@media (max-height:760px){.game.fit .eyebrow{display:none}}
/* shorter screens (laptops, 720p projectors): slimmer top bar and scoreboard so the game gets the room */
@media (max-height:800px){
  .topbar{padding-top:5px;padding-bottom:5px}
  .brand{font-size:22px} .brand .mark{width:28px;height:28px;font-size:16px}
  .topbar .btn{padding:6px 12px;font-size:15px}
  main{padding:12px clamp(12px,2vw,24px)}
  body .scoreboard{padding-top:4px;padding-bottom:4px}
  body .scoreboard .sb-team .sc{font-size:26px}
  body .scoreboard .sb-team .pm button{width:26px;height:26px}
  body .scoreboard .sb-tools button{padding:2px 8px;font-size:13px}
  .game.fit .bview>.hint{display:none}
  .sb-tools{gap:3px}
  .game.fit .game-head h1{font-size:34px}
  .game.fit .tray{--k:.72}
}
.bview{display:flex;flex-direction:column;gap:14px;min-width:0}
.fast{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.rules-list{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:19px}
.roll-log span.bad{color:var(--bad);border-color:var(--bad)}
.roll-log span:first-child{background:none;color:inherit;border-color:var(--line)}
.roll-log span:last-child{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
table.probes.rounds td{font-size:18px;font-weight:400;background:none}
.roll-log span.bad:last-child,.roll-log span.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
@media (max-width:1400px){.tray{--k:.88}}
@media (max-width:1100px){.tray{--k:.76}}
@media (max-width:600px){.tray{--k:.66}}
.tray:has(.dslot:nth-child(3)){gap:calc(var(--ds) * .22)}
.bingo-cols .caller{justify-content:center}
.dice-set{display:grid;gap:8px;justify-items:center;width:100%}
.set-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.seg.sm button{padding:6px 10px;font-size:15px}
.ss{display:grid;gap:3px;font-variant-numeric:tabular-nums;font-weight:700}
.ssh{display:grid;place-items:center;background:var(--ink);color:var(--paper);border-radius:6px;font-family:var(--display);font-weight:800;padding:0 8px}
.ssh.corner{background:var(--accent);color:var(--accent-ink)}
.ssc{display:grid;place-items:center;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;padding:0;min-width:0}
.ssc:hover{border-color:var(--ink)}
.ssc.hid{border-style:dashed;background:transparent}
.ssc.sel{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.ssc.lastroll{outline:3px solid var(--accent);outline-offset:-3px}
.ss-info{font-size:26px;font-weight:700}
.ss-info b{font-family:var(--display);font-size:36px}
.bprob{font-size:21px;font-weight:700;color:var(--ink)}
.ways{max-height:460px;overflow:auto}
.ways tr{cursor:pointer}
.ways tr:first-child td{background:none}
.ways tr.sel td{background:var(--hi);color:var(--hi-ink)}
.ways td{font-size:22px}
.big.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.big.dim{opacity:.18;transition:opacity .2s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- bingo ---------- */
.two-col{display:grid;grid-template-columns:minmax(300px,0.8fr) minmax(0,1.6fr);gap:20px;align-items:start}
.caller{align-items:center;text-align:center;overflow:hidden}
.callout{display:flex;flex-direction:column;align-items:center;gap:4px}
.bars{display:grid;gap:6px;align-items:end}
.bar{position:relative;height:260px;display:flex;align-items:flex-end;border-bottom:2px solid var(--ink)}
.bar .fill{width:100%;background:var(--accent);border-radius:6px 6px 0 0;transition:height .25s ease;min-height:0}
.bar.last .fill{background:var(--hi);outline:2px solid var(--ink)}
.bar .exp{position:absolute;left:-3px;right:-3px;border-top:3px dashed var(--bad)}
.bar .cnt{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.blab{text-align:center;font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.bprob{text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend .sw{display:inline-block;width:16px;height:12px;background:var(--accent);border-radius:3px;vertical-align:middle;margin-right:6px}
.legend .dash{display:inline-block;width:20px;border-top:3px dashed var(--bad);vertical-align:middle;margin-right:6px}
.history{display:flex;flex-wrap:wrap;gap:6px}
.history span{min-width:42px;text-align:center;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums}
.history span:first-child{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}

/* ---------- skunk ---------- */
.letters{display:flex;gap:10px;justify-content:center}
.letters span{width:clamp(56px,7vw,92px);aspect-ratio:1;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:clamp(40px,5vw,66px);border:3px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--muted)}
.letters span.cur{background:var(--ink);color:var(--paper)}
.letters span.done{text-decoration:line-through;opacity:.45}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tteam{border:2px solid var(--ink);border-top:10px solid var(--tc);border-radius:14px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tteam .nm{font-weight:700;font-size:19px}
.tteam .tot{font-family:var(--display);font-weight:900;font-size:58px;line-height:.95;font-variant-numeric:tabular-nums}
.tteam .st{font-size:16px;font-weight:700;min-height:1.4em}
.tteam.sat{background:color-mix(in srgb,var(--tc) 12%,var(--surface))}
.tteam.bust .st{color:var(--bad)}
.tteam .btn{width:100%}
.mathbox{border:2px dashed var(--ink);border-radius:14px;padding:16px 18px;background:var(--surface);display:grid;gap:8px}
.mathbox h3{font-size:26px}
.mathbox p{margin:0}
.mathbox table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.mathbox td,.mathbox th{padding:4px 14px 4px 0;text-align:left}
.pot{display:flex;flex-direction:column;align-items:center}

/* ---------- connect wall ---------- */
.wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{min-height:clamp(84px,11vh,128px);display:grid;place-items:center;text-align:center;padding:10px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);font-weight:700;font-size:clamp(18px,2vw,30px);line-height:1.25;user-select:none;transition:transform .1s ease,background .15s ease}
button.tile:hover{transform:translateY(-2px)}
.tile.sel{background:var(--hi);color:var(--hi-ink)}
.tile.f0{background:var(--g0);border-color:var(--g0);color:#fff}
.tile.f1{background:var(--g1);border-color:var(--g1);color:#fff}
.tile.f2{background:var(--g2);border-color:var(--g2);color:#fff}
.tile.f3{background:var(--g3);border-color:var(--g3);color:#fff}
.tile.miss{background:transparent;border-style:dashed;color:var(--muted)}
.tile.blank{color:var(--line);font-family:var(--display);font-size:48px}
.wall.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.mat{display:inline-grid;grid-template-columns:auto auto;column-gap:.55em;row-gap:.05em;padding:.05em .4em;border-left:2.5px solid currentColor;border-right:2.5px solid currentColor;border-radius:.45em;font-size:.82em;vertical-align:middle;text-align:center}
.sig{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin-right:.1em}
.sig small{font-size:.5em}
.sig span{font-size:1.15em}
.status{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:900;font-size:56px;font-variant-numeric:tabular-nums;line-height:1}
.clock.low{color:var(--bad)}
.lives{display:flex;gap:8px;align-items:center;font-weight:700}
.lives i{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);display:inline-block}
.lives i.on{background:var(--bad);border-color:var(--bad)}
.conn{display:grid;gap:8px}
.conn-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.conn-row .sw{width:18px;height:18px;border-radius:5px}
.conn-row .txt{font-weight:700;font-size:20px}
.conn-row .txt.hidden{color:var(--muted);font-weight:400;font-style:italic}
.wall-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.wall-list button,.wall-list .wl{text-align:left;padding:16px 18px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.wall-list b{font-family:var(--display);font-size:28px;font-weight:800}
.wall-list span{color:var(--muted);font-size:15px}
.wall-list .new{border-style:dashed}
textarea{width:100%;min-height:200px;font:inherit;font-size:17px;padding:12px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink)}
.score-line{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;font-size:20px}
.score-line b{font-family:var(--display);font-size:40px}

/* ---------- guess the rule ---------- */
.rule-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.machine{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.machine input{font:inherit;font-size:30px;font-weight:700;width:150px;padding:8px 12px;border:2.5px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.machine label{align-self:center;font-family:var(--display);font-weight:800;font-size:34px}
.secret{border:2.5px solid var(--ink);border-radius:14px;padding:18px 20px;background:var(--ink);color:var(--paper);font-size:clamp(26px,3vw,40px);font-weight:700;text-align:center;min-height:88px;display:grid;place-items:center}
.secret.hidden{background:repeating-linear-gradient(-45deg,var(--surface) 0 14px,var(--paper) 14px 28px);color:var(--muted);font-family:var(--display);font-size:44px}
table.probes{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.probes th{text-align:left;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--ink)}
table.probes td{font-size:28px;font-weight:700;padding:6px 10px;border-bottom:1.5px solid var(--line)}
table.probes td.arrow{color:var(--muted);width:40px}
table.probes tr:first-child td{background:color-mix(in srgb,var(--hi) 45%,transparent)}
.worth{font-weight:700;padding:6px 12px;border-radius:999px;background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink)}
svg.plot{width:100%;height:auto;max-height:440px;background:var(--surface);border-radius:12px}
svg.plot .ax{stroke:var(--ink);stroke-width:1.5}
svg.plot .gl{stroke:var(--line);stroke-width:1}
svg.plot .pt{fill:var(--accent)}
svg.plot .pt.last{fill:var(--hi);stroke:var(--ink);stroke-width:2}
svg.plot .pin{fill:var(--surface);stroke:var(--muted);stroke-width:2}
svg.plot .arr{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
svg.plot text{fill:var(--muted);font-family:var(--body);font-size:12px}

/* ---------- rigged ---------- */
.rig-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start}
.recent{display:flex;gap:6px;flex-wrap:wrap;min-height:36px}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.verdict .btn{font-size:30px}
.btn.rigged{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.fair{background:var(--good);border-color:var(--good);color:#fff}
.reveal{border:3px solid var(--ink);border-radius:14px;padding:18px;display:grid;gap:8px;background:var(--surface)}
.reveal h3{font-size:40px}
.reveal.win{border-color:var(--good)} .reveal.lose{border-color:var(--bad)}

/* ---------- award ---------- */
.award-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border:2px dashed var(--ink);border-radius:12px;background:var(--surface)}
.award-row.done{border-style:solid;border-color:var(--good)}
.tbtn{border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--surface));border-radius:999px;padding:6px 14px;font-weight:700}
.tbtn:hover{background:var(--tc);color:#fff}

/* ---------- scoreboard ---------- */
.scoreboard{border-top:2px solid var(--ink);background:var(--surface);padding:10px clamp(12px,2vw,24px);display:flex;gap:10px;align-items:stretch;overflow-x:auto}
.sb-team{flex:1 1 0;min-width:150px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;border-left:8px solid var(--tc);padding:4px 6px 4px 10px;border-radius:4px;transition:background .3s ease}
.sb-team.flash{background:color-mix(in srgb,var(--tc) 25%,transparent)}
.sb-team input{grid-column:1/3;font:inherit;font-weight:700;font-size:15px;border:0;border-bottom:1.5px dashed transparent;background:none;color:var(--ink);padding:0;min-width:0;width:100%}
.sb-team input:hover,.sb-team input:focus{border-bottom-color:var(--muted);outline:none}
.sb-team .sc{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.sb-team .pm{display:flex;gap:4px}
.sb-team .pm button{width:32px;height:32px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);font-weight:700;padding:0}
.sb-tools{display:flex;flex-direction:column;gap:6px;justify-content:center;padding-left:10px;border-left:2px solid var(--line);flex:0 0 auto}
.sb-tools .row{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700}
.scoreboard.off{padding:6px clamp(12px,2vw,24px)}
.sb-off{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;font-size:15px;color:var(--muted)}
.sb-off b{color:var(--ink)}
.sb-off button{border:2px solid var(--ink);border-radius:8px;background:var(--surface);font-size:14px;font-weight:700;padding:4px 12px}
.sb-tools button{border:2px solid var(--ink);border-radius:8px;background:var(--surface);font-size:14px;font-weight:700;padding:4px 10px}

/* ---------- shared bits for later games ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pick{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.pick select{font:inherit;font-weight:700;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink)}
.btn.team{background:var(--tc);border-color:var(--tc);color:#fff}
.tbtn[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.qbig{font-size:clamp(28px,3.2vw,48px);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- blockbusters ---------- */
.hex-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:20px;align-items:start}
svg.hexes{width:100%;height:auto;max-height:max(340px,calc(100vh - 400px))}
svg.hexes .hex{cursor:pointer;outline:none}
svg.hexes .hex polygon{stroke:var(--ink);stroke-width:2.5;transition:fill .2s ease}
svg.hexes .hex:hover polygon{stroke-width:4}
svg.hexes .hex:focus-visible polygon{stroke:var(--accent);stroke-width:6}
svg.hexes .hex.path polygon{stroke:var(--hi);stroke-width:8}
svg.hexes .hex text{font-family:var(--display);font-weight:900;font-size:44px;pointer-events:none;dominant-baseline:central;text-anchor:middle}
.qlabel{font-family:var(--display);font-weight:900;font-size:96px;line-height:.85;color:var(--accent)}
.qtext{font-size:clamp(24px,2.4vw,36px);font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.answer{font-size:clamp(28px,3vw,44px);font-weight:700;color:var(--good);margin:0}

/* ---------- pointless ---------- */
.pt-teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pt-team{border:2px solid var(--ink);border-top:10px solid var(--tc);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.pt-team input{font:inherit;font-size:24px;font-weight:700;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
.res{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;border:2px solid var(--line);font-weight:700}
.res.pointless{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.res.bad{color:var(--bad);border-style:dashed}
.board{display:flex;flex-wrap:wrap;gap:8px}
.ans{padding:6px 12px;border-radius:10px;border:2px solid var(--ink);font-weight:700;font-size:20px;display:inline-flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.ans.unsaid{color:var(--muted);border:2px dashed var(--line);font-weight:400}
.ans.pointless{background:var(--hi);color:var(--hi-ink)}
.ans i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid var(--surface)}

/* ---------- higher or lower ---------- */
.hl-stage{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:stretch}
.hl-card{border:3px solid var(--ink);border-radius:20px;background:var(--surface);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:300px;text-align:center;box-shadow:6px 6px 0 var(--ink)}
.hl-card .expr{font-size:clamp(40px,5vw,76px);font-weight:700;line-height:1.1}
.hl-card .val{font-family:var(--display);font-weight:900;font-size:clamp(40px,4.5vw,66px);color:var(--accent);font-variant-numeric:tabular-nums}
.hl-card .val.hidden{color:var(--line)}
.hl-mid{display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:220px}
.hl-mid .btn{font-size:30px}
.timebar{height:18px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--surface)}
.timebar i{display:block;height:100%;background:var(--accent)}
.timebar.low i{background:var(--bad)}

/* ---------- clue countdown ---------- */
.clues{display:grid;gap:10px}
.clue{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);font-size:clamp(20px,2.2vw,30px);font-weight:700;line-height:1.25}
.clue .w{font-family:var(--display);font-size:44px;font-weight:900;text-align:center;color:var(--accent);line-height:1}
.clue .w small{display:block;font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.clue.hidden{border-style:dashed;border-color:var(--line);color:var(--muted);font-weight:400;background:transparent}
.clue.hidden .w{color:var(--line)}

/* ---------- auction ---------- */
.banks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bank{border:2px solid var(--ink);border-left:10px solid var(--tc);border-radius:12px;padding:8px 12px;background:var(--surface);font-weight:700}
.bank b{display:block;font-family:var(--display);font-size:42px;font-variant-numeric:tabular-nums;line-height:1}
.lot{font-size:clamp(26px,3vw,42px);font-weight:700;line-height:1.25;margin:0;text-wrap:balance}

/* ---------- argand battleships ---------- */
.ab-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,1fr);gap:20px;align-items:start}
svg.argand{width:100%;height:auto;max-height:max(380px,calc(100vh - 330px));background:var(--surface);border-radius:12px}
svg.argand .gl{stroke:var(--line);stroke-width:1}
svg.argand .ax{stroke:var(--ink);stroke-width:2}
svg.argand text{fill:var(--muted);font-family:var(--body);font-size:13px}
svg.argand .axl{fill:var(--ink);font-weight:700;font-size:16px;font-style:italic}
svg.argand .lat{fill:var(--muted);opacity:.55;cursor:pointer}
svg.argand .lat:hover,svg.argand .lat.aim{opacity:1}
svg.argand .lat:hover{fill:var(--accent);r:8}
svg.argand .lat.aim{fill:var(--hi);stroke:var(--ink);stroke-width:2;r:9}
svg.argand .hit{fill:var(--bad)}
svg.argand .hitx{fill:#fff;font-size:15px;font-weight:700;pointer-events:none}
svg.argand .miss{fill:none;stroke:var(--muted);stroke-width:2.5}
svg.argand .ship{stroke:var(--good);stroke-width:26;stroke-linecap:round;opacity:.35}
svg.argand .ship.sunk{stroke:var(--bad);opacity:.25}
svg.argand .loc{fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:var(--accent);stroke-width:3}
svg.argand .locl{fill:none;stroke:var(--accent);stroke-width:4}
svg.argand .startpt{fill:var(--surface);stroke:var(--accent);stroke-width:3}
svg.argand .old{opacity:.3}
svg.argand .preview{stroke-dasharray:8 6;fill-opacity:.45}
.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:20px;font-weight:700}
.form-row input,.form-row select{font:inherit;font-size:20px;font-weight:700;width:72px;padding:6px 8px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink)}
.form-row select{width:auto}
.expr-preview{font-size:28px;font-weight:700;padding:10px 14px;border-radius:12px;background:var(--paper);border:2px solid var(--line);min-height:58px}
.scanlog{display:grid;max-height:220px;overflow:auto}
.scanlog div{display:flex;justify-content:space-between;gap:10px;padding:6px 4px;border-bottom:1.5px solid var(--line);font-size:17px}

@media (max-width:900px){
  .hex-grid,.ab-grid,.hl-stage{grid-template-columns:1fr}
}

/* ---------- phone bingo ---------- */
.btn.live-on{background:var(--good);border-color:var(--good);color:#fff}
.pb-prizes{display:flex;gap:8px;flex-wrap:wrap}
.pb-prize{padding:6px 12px;border:2px solid var(--line);border-radius:999px;font-size:15px;color:var(--muted)}
.pb-prize.cur{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pb-prize.won{border-color:var(--good);color:var(--ink);background:color-mix(in srgb,var(--good) 16%,transparent)}
.pb-wait{margin:0;font-size:20px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--hi) 30%,transparent)}
.pb-wait.ok{background:color-mix(in srgb,var(--good) 14%,transparent)}
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;overflow:auto;min-height:0;flex:1;align-content:start;padding:2px}
.pb-p{border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.pb-p.waiting{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.pb-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline;font-size:15px;min-width:0}
.pb-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-pts{font-family:var(--display);font-weight:900;font-size:22px;color:var(--accent)}
.mcard{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.mcard span{display:grid;place-items:center;aspect-ratio:1;border:1.5px solid var(--line);border-radius:6px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.mcard span.hit{background:var(--good);border-color:var(--good);color:#fff}
.mcard span.miss{border:2px dashed var(--bad);color:var(--bad)}
.mcard.empty{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13px;line-height:1.3;text-align:center;padding:4px}
.announce{position:fixed;left:50%;top:18%;transform:translate(-50%,0);z-index:70;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:900;font-size:clamp(34px,4vw,60px);padding:18px 34px;border-radius:20px;border:4px solid var(--hi);box-shadow:8px 8px 0 rgba(0,0,0,.35);text-align:center;max-width:90vw;animation:annIn .45s cubic-bezier(.2,1.5,.4,1)}
.announce.big{font-size:clamp(48px,6vw,96px);background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.announce.out{opacity:0;transition:opacity .5s ease}
@keyframes annIn{from{transform:translate(-50%,0) scale(.6);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}

/* ---------- live session dialog ---------- */
.live-btn.on{background:var(--good);border-color:var(--good);color:#fff}
.ldlg{position:fixed;inset:0;background:rgba(8,12,22,.55);display:grid;place-items:center;z-index:60;padding:16px}
.ldlg[hidden]{display:none}
.ldlg-box{background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:20px;width:min(1100px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:clamp(18px,2.4vw,32px);display:flex;flex-direction:column;gap:18px;box-shadow:8px 8px 0 var(--ink)}
.ldlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.ldlg-head h2{font-size:clamp(34px,4vw,52px)}
.ld-grid{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.3fr);gap:24px;align-items:start}
.ld-join{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:18px;border:2px dashed var(--ink);border-radius:16px}
.ld-code{font-family:var(--display);font-weight:900;font-size:clamp(64px,7vw,112px);letter-spacing:.08em;line-height:.9;max-width:100%}
.ld-url{font-size:clamp(18px,1.8vw,24px);font-weight:700;word-break:break-all}
.ld-qr{background:#fff;padding:10px;border-radius:10px;line-height:0}
.ld-qr img,.ld-qr canvas{width:200px;height:200px}
.ld-players{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:120px}
.ld-p{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:2px solid var(--line);border-radius:999px;font-weight:700;font-size:20px;background:var(--paper);animation:pin .3s ease}
.ld-p .dot{width:10px;height:10px;border-radius:50%;background:var(--good)}
.ld-p.off{opacity:.55}.ld-p.off .dot{background:var(--bad)}
.ld-p button{border:0;background:none;color:var(--muted);font-size:18px;padding:0 2px;cursor:pointer}
.ld-p button:hover{color:var(--bad)}
@keyframes pin{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.ld-count{font-family:var(--display);font-size:40px;font-weight:900}
@media (max-width:900px){.ld-grid{grid-template-columns:1fr}}

@media (max-width:900px){
  .two-col,.rule-grid,.rig-grid,.hero{grid-template-columns:1fr}
  .wall{gap:6px}
  .tile{font-size:16px;padding:6px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="mark" aria-hidden="true"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M7 1v18M13 1v18M1 7h18M1 13h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></span>The Grid</a>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <button class="btn ghost live-btn" id="liveBtn" type="button" aria-haspopup="dialog">📱 Live</button>
  <a class="btn ghost" id="homeBtn" href="#">All games</a>
  <button class="btn ghost" id="fsBtn" type="button">Full screen</button>
</header>
<main id="app"></main>
<footer class="scoreboard" id="scoreboard" aria-label="Team scores"></footer>
<div class="ldlg" id="liveDlg" hidden><div class="ldlg-box" role="dialog" aria-modal="true" aria-labelledby="ldTitle" id="liveBox"></div></div>

<script>
(() => {
"use strict";
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const PB_PRIZES = [["line", "A line", 1], ["corners", "Four corners", 2], ["full", "Full house", 3]];

const pbPts = id => pb.points[id] != null ? pb.points[id] : ((pbPlayers()[id] && pbPlayers()[id].score) || 0);   // survives a projector refresh
const pbName = id => (pbPlayers()[id] && pbPlayers()[id].name) || "?";

  Live.host.setState({v: GRID_VERSION, 
    game: "bingo", gameId: pb.gameId, phase: !n ? "lobby" : pb.prize === "done" ? "over" : "playing", locked: n > 0,
    cfg: {title: bingoTitle(), lo: D.rows[0][0], hi: D.rows[D.rows.length - 1][0]},
    ncalls: n, callKey: n ? "c" + n : "", last: n ? bingo.rolls[n - 1] : -1, calls: bingo.rolls.slice(),
    prize: pb.prize, winners,
  });
}
function pbAfterRoll() { if (pb.on) { pbWriteState(); pbEvaluate(); } }
/* Which cells really count: the call must match the number in that cell, and one call marks one cell only. */
function pbValidMarks(id) {
  const card = pbCard(id); if (!card) return null;
  const m = pb.marks[id] || {}, used = new Set(), ok = Array(9).fill(false);
  for (let i = 0; i < 9; i++) {
    const key = m[i]; if (typeof key !== "string" || !/^c\d+$/.test(key) || used.has(key)) continue;
    if (bingo.rolls[+key.slice(1) - 1] === card[i]) { ok[i] = true; used.add(key); }
  }
  return ok;
}
const pbHas = (prize, m) => prize === "line" ? PB_LINES.some(L => L.every(i => m[i])) : prize === "corners" ? [0, 2, 6, 8].every(i => m[i]) : m.every(Boolean);
function pbEvaluate() {
  if (!pb.on || !bingo.rolls.length) return;
  let changed = false;
  for (const [key, label, pts] of PB_PRIZES) {
    if (pb.prize !== key) continue;
    const won = Object.keys(pb.cards).filter(id => pbPlayers()[id] && (() => { const m = pbValidMarks(id); return m && pbHas(key, m); })());
    if (!won.length) break;
    pb.winners[key] = won; changed = true;
    won.forEach(id => { pb.points[id] = pbPts(id) + pts; Live.host.setScore(id, pb.points[id]); });
    announce(`${label}! ${won.map(pbName).join(", ")} ${won.length > 1 ? "score" : "scores"} ${pts}`, key === "full");
    pb.prize = key === "line" ? "corners" : key === "corners" ? "full" : "done";
  }
  if (changed) { pbWriteState(); pbRefresh(); }
}
/* Players who have the number just called on their card but haven't marked it yet. */
function pbWaiting() {
  const n = bingo.rolls.length; if (!n || pb.prize === "done") return [];
  const last = bingo.rolls[n - 1], key = "c" + n;
  return Object.keys(pb.cards).filter(id => {
    const card = pbCard(id); if (!card || !pbPlayers()[id]) return false;
    const m = pb.marks[id] || {}, ok = pbValidMarks(id);
    if (Object.values(m).includes(key)) return false;
    return card.some((v, i) => v === last && !ok[i]);
  });
}
function pbHint() {
  const n = bingo.rolls.length, ready = Object.keys(pb.cards).filter(id => pbPlayers()[id]).length, joined = Object.keys(pbPlayers()).length;
  if (!n) return `<b>${ready} of ${joined}</b> cards ready. Cards lock when you roll.`;
  if (pb.prize === "done") return "Game over. Press <b>New game</b> to play again: students keep their points.";
  const w = pbWaiting();
  return w.length ? `Still to mark: <b>${w.map(id => esc(pbName(id))).join(", ")}</b>` : "Everyone's marked. Roll when you're ready.";
}
function pbView() {
  const n = bingo.rolls.length, ids = Object.keys(pbPlayers());
  const rows = ids.map(id => { const card = pbCard(id), m = card ? pbValidMarks(id) : null; return {id, card, m, marked: m ? m.filter(Boolean).length : -1, pts: pbPts(id)}; })
    .sort((a, b) => b.pts - a.pts || b.marked - a.marked || pbName(a.id).localeCompare(pbName(b.id)));
  const waiting = new Set(pbWaiting());
  const prizeChips = PB_PRIZES.map(([k, label, pts]) => {
    const w = pb.winners[k], cur = pb.prize === k;
    return `<span class="pb-prize ${w ? "won" : cur ? "cur" : ""}"><b>${label}</b> · ${pts} ${pts === 1 ? "pt" : "pts"}${w ? ` · ${w.map(id => esc(pbName(id))).join(", ")}` : cur ? " · playing now" : ""}</span>`;
  }).join("");
  const missed = (card, m) => { if (!card) return []; const cnt = {}; bingo.rolls.slice(0, -1).forEach(v => cnt[v] = (cnt[v] || 0) + 1); const out = Array(9).fill(false);
    for (let i = 0; i < 9; i++) if (!m[i] && cnt[card[i]]) { const marked = card.filter((v, j) => v === card[i] && m[j]).length; const before = card.slice(0, i).filter((v, j) => v === card[i] && !m[j]).length; if (cnt[card[i]] - marked > before) out[i] = true; }
    return out; };
  return `
    <div class="panel-head"><h2>${ids.length} on phones</h2>
      <div class="controls"><button type="button" class="btn ghost" id="pbStop">${pb.stopArmed ? "Click again to stop" : "Stop the phone game"}</button></div></div>
    <div class="pb-prizes">${prizeChips}</div>
    <p class="pb-wait ${n && waiting.size ? "" : "ok"}">${pbHint()}</p>
    <div class="pb-grid">${rows.map(({id, card, m, pts}) => {
      const miss = card ? missed(card, m) : [];
      return `<div class="pb-p ${waiting.has(id) ? "waiting" : ""}">
        <div class="pb-top"><b>${esc(pbName(id))}</b><span class="pb-pts">${pts}</span></div>
        ${card ? `<div class="mcard">${card.map((v, i) => `<span class="${m[i] ? "hit" : miss[i] ? "miss" : ""}">${v}</span>`).join("")}</div>` : `<div class="mcard empty">${n ? "Next game" : "No card<br>yet"}</div>`}
      </div>`; }).join("") || `<p class="muted">Nobody's joined yet. Open 📱 Live at the top to show the code.</p>`}</div>`;
}
function pbRefresh() {
  if (current !== "bingo") return;
  const v = $("#bView"); if (v && bingo.view === "phones") v.innerHTML = pbView();
  const h = $("#pbHint"); if (h) h.innerHTML = pbHint();
}
function announce(text, big) {
  const el = document.createElement("div"); el.className = "announce" + (big ? " big" : ""); el.setAttribute("role", "status"); el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("out"), big ? 4500 : 3000); setTimeout(() => el.remove(), big ? 5100 : 3600);
}

/* ================= router ================= */
let current = "";
function rerender() { const g = GAMES[current]; if (g) g.render($("#app")); else renderHome($("#app")); }
function route() {
  const id = location.hash.slice(1);
  clearTimers(); keyHandler = null; onAwarded = null; $("#app").onclick = null; $("#app").onkeydown = null; bingo.busy = false; bingo.skip = null; bingoStop(); skunk.busy = false;
  if (id === "wall" && wall.phase === "playing") wall.phase = "ready";
  current = GAMES[id] ? id : "";
  $("#crumb").textContent = current ? "/ " + GAMES[current].title : "";
  $("#homeBtn").style.display = current ? "" : "none";
  $("#app").scrollTop = 0;
  rerender();
}
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (!$("#liveDlg").hidden) return;
  if (keyHandler) { if (e.code === "Space" && e.target.tagName === "BUTTON") e.target.blur(); keyHandler(e); }
});
$("#fsBtn").addEventListener("click", async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
  catch (e) { $("#fsBtn").textContent = "Use F11 for full screen"; }
});
window.addEventListener("hashchange", route);

function start(data) {
  if (data && Array.isArray(data.teams) && data.teams.length) teams = data.teams;
  renderScoreboard(); route();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({teams}));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
